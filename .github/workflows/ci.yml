name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev
      - dev_framework

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -buildvcs=false ./...

      - name: Build
        run: go build -buildvcs=false ./cmd/warspark
