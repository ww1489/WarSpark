server:
  port: 8080
  mode: debug
  read_header_timeout: 5s
  read_timeout: 30s
  write_timeout: 30s
  idle_timeout: 120s
  startup_timeout: 10s
  shutdown_timeout: 10s

cors:
  allowed_origins:
    - "*"
  allowed_methods:
    - GET
    - POST
    - PUT
    - PATCH
    - DELETE
    - OPTIONS
  allowed_headers:
    - Origin
    - Content-Type
    - Authorization
    - X-Request-ID
  expose_headers:
    - X-Request-ID
  allow_credentials: false
  max_age: 24h

mysql:
  user: root
  password: ""
  host: 127.0.0.1
  port: "3306"
  db: warspark
  charset: utf8mb4
  parse_time: true
  loc: Local
  max_open: 100
  max_idle: 10
  conn_max_lifetime: 1h
  conn_max_idle_time: 10m

redis:
  addr: 127.0.0.1
  port: "6379"
  password: ""
  db: 0
  pool_size: 10
  min_idle_conns: 5
  dial_timeout: 5s
  read_timeout: 3s
  write_timeout: 3s
  conn_max_lifetime: 30m

jwt:
  secret: change-me-in-production
  issuer: warspark
  access_expire: 30m
  refresh_expire: 168h

log:
  level: info
  console:
    enabled: true
  file:
    enabled: true
    path: logs/warspark.log
    max_size_mb: 100
    max_backups: 30
    max_age_days: 30
    compress: true

docs:
  swagger_enabled: true

coc:
  base_url: "https://api.clashofclans.com/v1"
  api_token: ""
  timeout: 10s
  current_war_cache_ttl: 2m
  cwl_group_cache_ttl: 5m
